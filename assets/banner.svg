<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.3" />
    </pattern>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Scanner Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes scanMove {
      0% { transform: translateY(-40px); }
      50% { transform: translateY(340px); }
      100% { transform: translateY(-40px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatElem {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    .tag-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dashed-line {
      stroke-dasharray: 6, 6;
      animation: dashMove 15s linear infinite;
    }
    .scanning-bar {
      animation: scanMove 7s ease-in-out infinite;
    }
    .floating-box {
      animation: floatElem 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="240" r="180" fill="#6366f1" opacity="0.09" filter="url(#glow)">
    <animate attributeName="opacity" values="0.07;0.15;0.07" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Blueprint Architectural Overlay Graphic (Right Side) -->
  <g transform="translate(820, 45)" opacity="0.85">
    <!-- Isometric Cube / BIM Model Wireframe -->
    <polygon points="160,40 280,105 160,170 40,105" fill="#1e293b" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8" />
    <polygon points="40,105 160,170 160,285 40,220" fill="#0f172a" fill-opacity="0.4" stroke="#6366f1" stroke-width="1.8" stroke-opacity="0.8" />
    <polygon points="160,170 280,105 280,220 160,285" fill="#1e1e38" fill-opacity="0.4" stroke="#06b6d4" stroke-width="1.8" stroke-opacity="0.8" />
    
    <!-- Measurement Dimensions & Callouts -->
    <line x1="20" y1="105" x2="20" y2="220" stroke="#f59e0b" stroke-width="1.5" class="dashed-line" />
    <circle cx="20" cy="105" r="3" fill="#f59e0b" />
    <circle cx="20" cy="220" r="3" fill="#f59e0b" />
    <text x="10" y="168" fill="#fbbf24" font-size="11" font-family="monospace" text-anchor="end">H: 115 LF</text>

    <line x1="40" y1="240" x2="160" y2="305" stroke="#10b981" stroke-width="1.5" class="dashed-line" />
    <circle cx="40" cy="240" r="3" fill="#10b981" />
    <circle cx="160" cy="305" r="3" fill="#10b981" />
    <text x="100" y="295" fill="#34d399" font-size="11" font-family="monospace" text-anchor="middle">A: 2,450 SF</text>

    <!-- Takeoff Nodes -->
    <circle cx="160" cy="40" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="280" cy="105" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="160" cy="170" r="6" fill="#ec4899" filter="url(#softGlow)">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="105" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="160" cy="285" r="5" fill="#06b6d4" filter="url(#softGlow)" />

    <!-- Animated Scanning Line -->
    <rect x="10" y="0" width="300" height="40" fill="url(#scanGrad)" class="scanning-bar" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#94a3b8" class="tag-badge">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-size="38" class="title-text">
      Awesome Construction
    </text>
    <text x="0" y="192" fill="url(#accentGrad)" font-size="38" class="title-text" filter="url(#softGlow)">
      Estimating &amp; Quantity Takeoff
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="235" fill="#94a3b8" font-size="16" class="sub-text">
      Comprehensive guide to SaaS Platforms, Open-Source Tools, BIM 5D &amp; AI Takeoff
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 272)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="65" y="18" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">📐 Digital Takeoff</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="125" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="204" y="18" fill="#a78bfa" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">🏗️ 5D BIM &amp; BOQ</text>

      <!-- Tag 3 -->
      <rect x="279" y="0" width="125" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="341" y="18" fill="#34d399" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">🤖 AI Estimation</text>

      <!-- Tag 4 -->
      <rect x="416" y="0" width="135" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="483" y="18" fill="#fbbf24" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">⚡ Open-Source Stack</text>
    </g>
  </g>

  <!-- Border Accent Line -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#accentGrad)" stroke-width="2" />
</svg>
